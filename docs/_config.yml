# GitHub Pages (Jekyll) settings for the docs site.
# Every markdown page in docs/ renders with the HUD layout in _layouts/default.html.
# Built and deployed by .github/workflows/pages.yml.

title: REDcode
url: https://edgemodders.github.io
baseurl: /REDcode
repo: https://github.com/Edgemodders/REDcode

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

defaults:
  - scope:
      path: ""
    values:
      layout: default

# Status bar links, in order.
nav:
  - title: Docs
    url: /
  - title: Dev setup
    url: /dev-setup.html
  - title: Design
    url: /design.html
  - title: CR2W editor
    url: /design/cr2w-editor.html
  - title: Ship
    url: /design/ship.html
  - title: View
    url: /design/view.html
  - title: MCP
    url: /mcp.html
  - title: Extension API
    url: /api.html
