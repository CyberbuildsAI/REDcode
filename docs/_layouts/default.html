<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% if page.title and page.url != "/" %}{{ page.title }} · {% endif %}REDcode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Rajdhani:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/hud.css' | relative_url }}">
</head>
<body>

<div class="bar"><div class="wrap">
  <a class="home" href="{{ '/' | relative_url }}"><span class="dot"></span><b>REDCODE</b> / DOCS</a>
  <nav>
    {% for item in site.nav %}<a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>{% endfor %}
  </nav>
</div></div>

<main class="wrap doc">
{{ content }}
</main>

<footer class="wrap">
  <span>SOURCE: <a href="{{ site.repo }}/blob/main/docs/{{ page.path }}">docs/{{ page.path }}</a></span>
  <span>REDNODE &middot; MIT</span>
</footer>

</body>
</html>
